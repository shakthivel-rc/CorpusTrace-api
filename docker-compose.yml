# The whole stack: MySQL, the API, and the SPA behind nginx.
#
# `scripts/bootstrap.sh` is the intended entry point — it writes the .env this file reads
# and makes sure the SPA repo is present. Running `docker compose up` directly works too,
# once those two things are true.
#
# NOTE ON THE SPA BUILD CONTEXT. Nexarag-app is a separate repository, so this file builds
# it from a sibling directory (`../Nexarag-app`). That is unusual, and it is a consequence
# of the project living in two repos with no parent: something has to own the compose file,
# and the API is the half that owns the database and the migrations. The bootstrap script
# clones the sibling if it is missing. If you would rather not build the SPA at all, run
# `docker compose up db api` and use `npm run dev` for the frontend.

# The project name is what every container, network and volume is prefixed with, so it is
# also what decides *which* database a stack talks to. Interpolated rather than fixed
# because bootstrap.sh needs one escape hatch: a db-data volume whose password this
# checkout no longer knows cannot be recovered, and building a second stack beside it is
# the only repair that does not delete somebody's data. See scripts/lib/run_docker.sh.
name: ${COMPOSE_PROJECT_NAME:-nexarag}

services:
  db:
    # Overridable only so setup can react to a tag with no image for the local
    # architecture. MySQL 8.0 publishes amd64 and arm64, so this is a backstop, not a knob:
    # point it at something that is not MySQL and the migrations are on their own.
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexarag}
      MYSQL_USER: ${MYSQL_USER:-nexarag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    # utf8mb4 all the way down: document text and user names are not ASCII, and MySQL's
    # older default silently mangles anything outside the BMP — including most emoji.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    ports:
      # Exposed so you can point a client at it. Loopback-only on purpose — binding
      # 0.0.0.0 would publish the database to the local network.
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      # --silent so the credentials never reach the log. `api` waits on this, which is what
      # stops it racing the ~20s MySQL takes to initialise a fresh data directory.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # PyMySQL rather than mysqlclient for the URL: both are installed, and the pure-Python
      # driver removes one moving part from the container's startup path.
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-nexarag}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-nexarag}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env — bootstrap.sh generates one}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The SPA is served same-origin through nginx, so the browser never issues a
      # cross-origin request in this setup. Listed anyway for anyone running `npm run dev`
      # against these containers.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      RAG_UPLOAD_DIR: /app/uploads/rag
      # Where Ollama is, for local embeddings. `localhost` would be this container, so the
      # service name is the only value that can work from in here. Harmless when the
      # `embeddings` profile is not running: nothing calls Ollama unless a document was
      # uploaded asking for one of its models.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Optional. Present so the entrypoint can seed on a first run.
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      # Set this if you ever intend to rotate SECRET_KEY: it doubles as the fallback
      # encryption key for stored LLM credentials, so rotating it without this makes every
      # saved provider key undecryptable. See CLAUDE.md §13.
      LLM_CREDENTIAL_ENCRYPTION_KEY: ${LLM_CREDENTIAL_ENCRYPTION_KEY:-}
    volumes:
      # Uploaded documents outlive the container. Without this, every rebuild silently
      # empties every knowledge base while the database still lists them.
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  app:
    build:
      context: ../Nexarag-app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

  # Local embeddings, off by default.
  #
  #   docker compose --profile embeddings up -d
  #   docker compose --profile embeddings exec ollama ollama pull embeddinggemma
  #
  # Behind a profile because it is opt-in in every sense: it pulls a ~1 GB image, then a
  # 622 MB model, and it is only of use to someone who has decided to embed a document.
  # The rest of the stack neither starts it nor depends on it, and a knowledge base that
  # was never configured for embeddings never calls it.
  #
  # Why this is the recommended way to run EmbeddingGemma here: Ollama's library serves the
  # same weights as google/embeddinggemma-300m on Hugging Face, but without the gate — the
  # HF repo requires an account, an accepted Gemma licence and a token before anything can
  # be downloaded, none of which an application can do on the operator's behalf. And the
  # documents never leave this machine, which is the part that matters for a RAG tool
  # holding somebody's contracts.
  ollama:
    image: ollama/ollama:latest
    profiles: ["embeddings"]
    restart: unless-stopped
    volumes:
      # Pulled models live here. Without it, every restart re-downloads 622 MB.
      - ollama-models:/root/.ollama
    ports:
      # Loopback only, like the database: an unauthenticated model server on 0.0.0.0 is an
      # open inference endpoint for the whole local network.
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
  uploads:
  ollama-models:
