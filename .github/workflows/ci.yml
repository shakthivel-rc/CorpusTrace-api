# nexarag-api test CI. Separate from buildspec.yml (which only fires a remote deploy) —
# this workflow is the actual gate: install, migrate, test, report.
name: nexarag-api CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexarag_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # conftest.py forces DATABASE_URL to this, so the whole suite (unit + integration,
      # including the Alembic round-trip test) runs against real MySQL in CI.
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/nexarag_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # mysqlclient (pinned in requirements.txt) needs the MySQL client headers to build.
      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=reports/pytest-junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexarag-api-test-reports
          path: |
            coverage.xml
            htmlcov/
            reports/
