# Test + coverage configuration for CorpusTrace API.
# NOTE: intentionally has NO [build-system] table — this file is config only, it does
# not turn this API into an installable package.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure/unit tests that need no database",
    "integration: tests that require a database (SQLite locally, MySQL in CI)",
    "live: tests that talk over HTTP to a running stack; skipped unless CORPUSTRACE_LIVE_URL is set",
]
addopts = "-ra"
filterwarnings = [
    # passlib probes bcrypt.__about__ which bcrypt 4.1+ removed — noisy but harmless.
    "ignore:.*error reading bcrypt version.*:UserWarning",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "alembic/*",
    "seeders/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Ratchet floor. Raise this, never lower it.
#
# Moved 40 -> 65 on 2026-08-20 with the High-Precision RAG mode: the whole-suite number is
# 79.9% and `rag/service.py` reached 91%, so 40 had stopped being a floor and become a
# decoration.
#
# 65 rather than something closer to 80 because this threshold applies to whatever ran, and
# `pytest -m unit --cov` — the no-database subset — measures 68.0%. A floor above that would
# fail the subset run the marker exists to make convenient, which is how a coverage gate
# teaches people to pass `--no-cov`.
#
# What still drags the total down is deliberate: the LLM provider layer, SMTP, and the parts
# of the RAG engine that only a real corpus exercises.
fail_under = 65
